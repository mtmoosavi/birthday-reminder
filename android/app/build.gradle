apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing.
// Credentials live in ../keystore.properties (git-ignored). When that file is
// absent — e.g. a fresh clone or CI without secrets — the release build falls
// back to an unsigned APK instead of failing.
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseKeystore = keystoreProperties["storeFile"] != null
}

// CI / environment overrides ------------------------------------------------
// A fresh clone (and CI) has no keystore.properties because it is git-ignored.
// When KEYSTORE_PATH is present we sign from environment variables instead, so
// the release build never needs a checked-in credentials file.
def envKeystorePath = System.getenv("KEYSTORE_PATH")
def hasEnvKeystore = envKeystorePath != null && !envKeystorePath.trim().isEmpty() && file(envKeystorePath).exists()
def resolveStoreFile = { hasReleaseKeystore ? file(keystoreProperties["storeFile"]) : file(envKeystorePath) }
def resolveStorePassword = { hasReleaseKeystore ? keystoreProperties["storePassword"] : System.getenv("KEYSTORE_PASSWORD") }
def resolveKeyAlias = { hasReleaseKeystore ? keystoreProperties["keyAlias"] : System.getenv("KEY_ALIAS") }
def resolveKeyPassword = { hasReleaseKeystore ? keystoreProperties["keyPassword"] : System.getenv("KEY_PASSWORD") }
def canSignRelease = hasReleaseKeystore || hasEnvKeystore

def envVersionCode = System.getenv("ANDROID_VERSION_CODE")
def envVersionName = System.getenv("ANDROID_VERSION_NAME")

// Single source of truth for the version: package.json. Overridable from the
// environment so CI can stamp a version without editing files.
def packageJsonFile = rootProject.file("../package.json")
def packageVersion = packageJsonFile.exists()
    ? new groovy.json.JsonSlurper().parseText(packageJsonFile.text).version
    : "1.0.0"
// 1.2.3 -> 10203, so versionCode always grows with the version name.
def versionCodeFromName = { String name ->
    def matcher = name =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!matcher.find()) return 1
    return matcher.group(1).toInteger() * 10000 + matcher.group(2).toInteger() * 100 + matcher.group(3).toInteger()
}
def resolvedVersionName = envVersionName ?: packageVersion
def resolvedVersionCode = envVersionCode ? envVersionCode.toInteger() : versionCodeFromName(resolvedVersionName)

android {
    namespace "com.mtmoosavi.birthdayreminder"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mtmoosavi.birthdayreminder"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (canSignRelease) {
        signingConfigs {
            release {
                storeFile resolveStoreFile()
                storePassword resolveStorePassword()
                keyAlias resolveKeyAlias()
                keyPassword resolveKeyPassword()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (!canSignRelease) {
    logger.warn("No release keystore found (keystore.properties or KEYSTORE_PATH); the release APK will be unsigned.")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
