name: Build iOS app

# Builds the Capacitor iOS project on a macOS runner so the Xcode project keeps
# compiling even though the app is developed on Windows. This produces an
# unsigned simulator build; App Store distribution needs signing on a Mac.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build web assets and sync iOS
        run: npm run ios:sync

      - name: Build for the iOS simulator (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: birthday-reminder-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app

      # Produces a device .ipa. It is unsigned because signing needs your Apple
      # ID / certificate; Sideloadly, AltStore or Xcode re-sign it on install.
      - name: Archive for device (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -qry "../birthday-reminder-${VERSION}-unsigned.ipa" Payload
          ls -lh ../*.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: birthday-reminder-ios-ipa
          path: build/*.ipa
